{% load i18n %}
{% comment %}
Parça kodu ile arama. Arama panelinde (partials/arama_paneli.html) araç
filtrelerinin altında durur; sonuç sayfasında aranan kod (secili.q) dolu gelir.
z-10: üstteki araç filtrelerinin (z-30) açılır menüleri bu satırın üstünde kalsın.
{% endcomment %}
<form action="{% url 'arama' %}" method="get" role="search"
      class="relative z-10 flex flex-col gap-2 sm:flex-row sm:items-stretch sm:gap-2.5">
    <label for="kod-arama-{{ kimlik|default:'ana' }}"
           class="group flex min-w-0 flex-1 items-center gap-3 rounded-lg bg-anthracite-950 px-3.5 ring-1 ring-inset ring-black/[0.06] transition-shadow hover:ring-accent-500/40 focus-within:ring-2 focus-within:ring-accent-500 dark:bg-anthracite-900 dark:ring-white/[0.06] lg:px-4">
        <span class="grid h-9 w-9 shrink-0 place-items-center rounded-md bg-accent-500/10 text-accent-500 ring-1 ring-inset ring-accent-500/20 dark:text-accent-400" aria-hidden="true">
            {# barkod #}
            <svg class="h-[1.125rem] w-[1.125rem]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5v14M8 5v14M12 5v14M17 5v14M21 5v14"/></svg>
        </span>
        <span class="min-w-0 flex-1 py-2.5">
            <span class="block truncate text-caption font-semibold uppercase tracking-wider text-aluminium-500">{% trans "Parça kodunu biliyor musunuz?" %}</span>
            <input id="kod-arama-{{ kimlik|default:'ana' }}" type="search" name="q" value="{{ secili.q }}" required
                   autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="search"
                   placeholder="{% trans 'Parça kodu veya ürün adı, ör. BP-123' %}"
                   class="block w-full min-w-0 border-0 bg-transparent p-0 font-mono text-[0.9375rem] font-medium tracking-wide text-white outline-none placeholder:font-sans placeholder:font-normal placeholder:tracking-normal placeholder:text-aluminium-500 focus:ring-0">
        </span>
    </label>
    <button type="submit" class="inline-flex h-12 shrink-0 items-center justify-center gap-2 rounded-lg border border-accent-500/40 px-6 text-button text-accent-500 outline-none transition-colors hover:border-accent-500 hover:bg-accent-500 hover:text-on-accent focus-visible:ring-2 focus-visible:ring-accent-500 dark:text-accent-400 dark:hover:text-on-accent sm:h-auto sm:min-w-[9.5rem] lg:min-w-[10.5rem]">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.25" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 10.5a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z" /></svg>
        {% trans "Kodla Ara" %}
    </button>
</form>
